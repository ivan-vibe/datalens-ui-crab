# Optional TLS server block for the Theme Fork UI.
# Mount this file into /etc/nginx/tls.d/8443.conf and mount certs into
# /etc/nginx/certs/. See docker-compose.tls.yml.
server {
    listen 8443 ssl http2;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    add_header Access-Control-Allow-Headers "Content-Type,X-Request-ID,X-Charts-Cache-Token,X-Charts-Request-ID,X-CSRF-Token,X-DL-Allow-Superuser,X-DL-Sudo,X-Chart-Id,X-Timezone-Offset,X-Dash-Info,x-dl-tenantid";
    add_header Access-Control-Expose-Headers "X-Request-Id, X-Trace-Id" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Max-Age 86400;

    if ($request_method = OPTIONS) {
        return 200;
    }

    proxy_hide_header Access-Control-Allow-Origin;

    root /opt/app/dist/public;

    location = /api/run/batch/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8099/api/run/batch/stream;
    }

    location = /api/run/batch {
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8099/api/run/batch;
    }

    location = /api/run {
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_pass http://host.docker.internal:8099/api/run;
    }

    location / {
        try_files $uri @node;
    }

    location @node {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://localhost:3030;
        proxy_redirect off;
    }
}
